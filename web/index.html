<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat room</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="chat.css"></head><body>
<header><div class="room-heading"><img src="icon.svg" alt="" width="22" height="22"><h1>Common room</h1></div><button id="identity" class="identity" title="Change your chat name" aria-label="Change your chat name"><span id="avatar">J</span><span id="display-name">James</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m5 6 3 3 3-3"/></svg></button></header>
<main id="conversation"><button id="earlier" class="earlier" hidden>Earlier messages</button><div id="messages" role="list" aria-label="Messages" tabindex="0"></div><div id="empty" hidden><img src="icon.svg" alt="" width="38" height="38"><h2>Start the conversation</h2></div><div id="loading" aria-label="Loading messages"><i></i><i></i><i></i></div><button id="jump" hidden>New messages <span aria-hidden="true">↓</span></button></main>
<form id="composer"><div class="compose-box"><label for="message" class="sr-only">Message Common room</label><textarea id="message" rows="1" placeholder="Message Common room…" maxlength="4000" spellcheck="true" enterkeyhint="send" autofocus></textarea><div class="compose-actions"><span id="send-status" role="status"></span><button id="send" type="submit" aria-label="Send message" title="Send message (Enter)" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15V5m-4 4 4-4 4 4"/></svg></button></div></div><div class="compose-hint"><span>Enter to send <span aria-hidden="true">·</span> Shift + Enter for a new line</span><span id="counter" hidden></span></div></form>
<div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
<dialog id="profile"><form method="dialog"><h2>Your name</h2><label for="name">How you appear in this room</label><input id="name" autocomplete="nickname" maxlength="40" required><div><button value="cancel" formnovalidate>Cancel</button><button id="save-name" value="save">Save</button></div></form></dialog>
<script src="sdk.js"></script><script type="module" src="chat.mjs"></script></body></html>
